[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-namer"
version = "1.0.0"
description = "Give family photos and videos dated, descriptive file names, with AI suggestions you review first."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
heic = ["pillow-heif>=0.16"]
faces = ["opencv-python-headless>=4.8", "numpy"]
dev = ["pytest>=8"]

[project.scripts]
media-namer = "media_namer.app:main"

[tool.setuptools]
packages = ["media_namer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
